services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agc-be:latest
    container_name: agc_app
    ports:
      - "8000:8000"
    volumes:
      - ./main:/app            # dev — 코드 수정이 --reload 로 바로 반영
      - ./uploads:/uploads     # 업로드 사진 — 이 PC 디스크 (BE/uploads). /app 밖이라 코드 폴더와 안 섞인다
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: agc_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
