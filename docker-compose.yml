services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agc-be:latest
    container_name: agc_app
    ports:
      - "127.0.0.1:8000:8000"   # 이 PC 에서만. 외부 접속은 nginx(443) 로만
    volumes:
      - ./main:/app            # dev — 코드 수정이 --reload 로 바로 반영
      - ./uploads:/uploads     # 업로드 사진 — 이 PC 디스크 (BE/uploads). /app 밖이라 코드 폴더와 안 섞인다
      - ./private:/private     # 회사 서류 — 공개(/files) 아님, API 가 권한 확인 후 내려준다
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - PRIVATE_DIR=/private
    # --proxy-headers: nginx 가 넘긴 X-Forwarded-For 로 실제 접속 IP 를 본다 (8000 은 이 PC 에서만 열려 있어 위조 불가)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: agc_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"   # 이 PC 에서만
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # HTTPS — nginx 가 443 을 받아 app:8000 으로 넘긴다. 인증서는 certbot (Let's Encrypt), 도메인은 .env 의 BE_DOMAIN
  nginx:
    image: nginx:1.30.1-alpine
    container_name: agc_nginx
    ports:
      - "80:80"                 # 인증서 발급 확인 + https 로 넘기기
      - "443:443"
    environment:
      - DOMAIN=${BE_DOMAIN:-}
      - TZ=Asia/Seoul
      - PRIVATE_DIR=/private
    volumes:
      - ./nginx:/etc/nginx/agc:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: ["/bin/sh", "/etc/nginx/agc/start.sh"]
    depends_on:
      - app
    restart: always

  # 인증서 자동 갱신 — 12시간마다 확인, 만료 30일 전이면 갱신. nginx 는 1시간 안에 새 인증서로 reload
  certbot:
    image: certbot/certbot:v5.5.0
    container_name: agc_certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: always

  # Cloudflare Tunnel (2026-10-27) — 밖에서 들어오는 포트 없이 api.eidofood.com → agc_nginx:443 로 연결.
  #   경로(호스트 이름 → 서비스)는 Cloudflare 대시보드(Networking › Tunnels › eido-home)에서 관리. 토큰은 .env 의 CF_TUNNEL_TOKEN.
  #   nginx 인증서는 IP 용이라 Cloudflare 쪽에서 "No TLS Verify" 로 붙는다 (이 PC 안 Docker 네트워크 구간만).
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    container_name: agc_cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      - TZ=Asia/Seoul
    depends_on:
      - nginx
    restart: always

volumes:
  postgres_data:
  letsencrypt:      # 인증서·계정키 (백업 대상)
  certbot_www:      # 발급 확인용 임시 파일
